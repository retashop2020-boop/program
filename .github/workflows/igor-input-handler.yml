name: Igor Input Handler CI

on:
  push:
    paths:
      - "igor-input-handler/igor-input-handler-v1.0rc2/**"
      - ".github/workflows/igor-input-handler.yml"
  pull_request:
    paths:
      - "igor-input-handler/igor-input-handler-v1.0rc2/**"
      - ".github/workflows/igor-input-handler.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: igor-input-handler/igor-input-handler-v1.0rc2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Ensure tests are collected
        run: python -m pytest --collect-only -q
      - name: Run tests and enforce branch coverage
        run: python -m pytest -q --cov=igor_input_handler --cov-branch --cov-fail-under=90
